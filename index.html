<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon Aura</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #1a1f3c, #05070f);
  color:#fff;
}

/* HEADER */
header{
  padding:25px;
  text-align:center;
  position:relative;
}
header h1{
  margin:0;
  letter-spacing:4px;
}
header p{
  color:#c9a44c;
  margin-top:6px;
  font-size:15px;
}

/* MENU BUTTON */
.menu-btn{
  position:absolute;
  top:22px;
  right:22px;
  font-size:26px;
  cursor:pointer;
}

/* MAIN BUTTONS */
.main{
  max-width:420px;
  margin:40px auto;
  padding:0 15px;
}
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:18px;
  border-radius:40px;
  margin-bottom:18px;
  font-size:18px;
  font-weight:600;
  text-decoration:none;
  color:#fff;
}
.whatsapp{background:#25d366;}
.location{background:#3b6eea;}
.call{background:#e4572e;}
.instagram{background:#c13584;}

/* MENU OVERLAY */
.menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.menu a{
  color:#fff;
  text-decoration:none;
  font-size:22px;
  margin:15px 0;
}
.close{
  position:absolute;
  top:20px;
  right:25px;
  font-size:30px;
  cursor:pointer;
}

/* CONTACT SECTION */
#contact{
  display:none;
  max-width:420px;
  margin:40px auto;
  padding:0 15px;
}
.contact-btn{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:18px;
  border-radius:40px;
  margin-bottom:16px;
  font-size:18px;
  font-weight:600;
  color:#fff;
  text-decoration:none;
}
.fb{background:#1877f2;}
.tiktok{background:#000;}
</style>
</head>

<body>

<header>
  <div class="menu-btn" onclick="openMenu()"><i class="fas fa-bars"></i></div>
  <h1>SALON AURA</h1>
  <p>Where Beauty Meets Elegance</p>
</header>

<div class="main" id="home">
  <a class="btn whatsapp" href="https://wa.me/94774657460"><i class="fab fa-whatsapp"></i> Book Appointment</a>
  <a class="btn location" href="#"><i class="fas fa-map-marker-alt"></i> Location</a>
  <a class="btn call" href="tel:+94774657460"><i class="fas fa-phone"></i> Call</a>
  <a class="btn instagram" href="https://instagram.com/_salonaura_"><i class="fab fa-instagram"></i> Instagram</a>
</div>

<div id="contact">
  <a class="contact-btn whatsapp" href="https://wa.me/94774657460"><i class="fab fa-whatsapp"></i> WhatsApp</a>
  <a class="contact-btn instagram" href="https://instagram.com/_salonaura_"><i class="fab fa-instagram"></i> Instagram</a>
  <a class="contact-btn fb" href="https://www.facebook.com/profile.php?id=61572539954499"><i class="fab fa-facebook-f"></i> Facebook</a>
  <a class="contact-btn tiktok" href="https://www.tiktok.com/@_salonaura.official"><i class="fab fa-tiktok"></i> TikTok</a>
</div>

<div class="menu" id="menu">
  <div class="close" onclick="closeMenu()">×</div>
  <a onclick="showHome()">Home</a>
  <a onclick="showContact()">Contact</a>
</div>

<script>
function openMenu(){document.getElementById("menu").style.display="flex";}
function closeMenu(){document.getElementById("menu").style.display="none";}
function showContact(){
  document.getElementById("home").style.display="none";
  document.getElementById("contact").style.display="block";
  closeMenu();
}
function showHome(){
  document.getElementById("contact").style.display="none";
  document.getElementById("home").style.display="block";
  closeMenu();
}
</script>

</body>
</html>
