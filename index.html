<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon Aura</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{
  min-height:100vh;
  background:radial-gradient(circle at top,#1a1f3c,#050814);
  color:#fff;
}

/* MENU */
.menu{
  position:fixed;top:15px;right:15px;
  font-size:26px;cursor:pointer;z-index:5
}
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;
  transition:.3s;z-index:4
}
.overlay.on{opacity:1;visibility:visible}

.side{
  position:fixed;top:0;right:-260px;
  width:260px;height:100%;
  background:#0b0f2a;
  padding:60px 25px;
  transition:.3s;z-index:6
}
.side.on{right:0}
.side a{
  display:block;color:#fff;
  text-decoration:none;
  margin:18px 0;font-weight:500
}
.side a:hover{color:#d4af37}

/* HOME */
.box{
  text-align:center;
  max-width:360px;
  margin:130px auto;
}
h1{letter-spacing:3px;font-size:2.2rem}
.tag{color:#d4af37;font-style:italic;margin:10px 0 25px}

.btn{
  display:flex;align-items:center;justify-content:center;
  gap:8px;
  margin:10px 0;
  padding:14px;
  border-radius:25px;
  color:#fff;text-decoration:none;font-weight:600
}
.w{background:#25D366}
.l{background:#4285F4}
.c{background:#ff5722}
.i{background:#d62976}

/* ABOUT */
.about{
  display:none;
  text-align:center;
  color:#ccc;
  padding:40px
}

/* ADMIN */
#admin{
  display:none;
  padding:40px;
  text-align:center
}
.admin-card{
  max-width:420px;
  margin:auto;
  background:#0e143a;
  padding:30px;
  border-radius:16px
}
</style>
</head>

<body>

<div class="menu" onclick="toggleMenu()">
  <i class="fa fa-bars"></i>
</div>

<div class="overlay" id="ov" onclick="toggleMenu()"></div>

<div class="side" id="side">
  <a onclick="showHome()">Home</a>
  <a onclick="showAbout()">About</a>
  <a onclick="adminLogin()">Admin Login</a>
</div>

<!-- HOME -->
<div id="home" class="box">
  <h1>SALON AURA</h1>
  <div class="tag">Where Beauty Meets Elegance</div>

  <a class="btn w" href="https://wa.me/94774675460">
    <i class="fab fa-whatsapp"></i> Book Now
  </a>
  <a class="btn l" href="#">
    <i class="fa fa-map-marker-alt"></i> Location
  </a>
  <a class="btn c" href="tel:+94774675460">
    <i class="fa fa-phone"></i> Call
  </a>
  <a class="btn i" href="https://instagram.com/_salonaura_">
    <i class="fab fa-instagram"></i> Instagram
  </a>
</div>

<!-- ABOUT -->
<div id="about" class="about">
  <h2>About Salon Aura</h2>
  <br>
  <p>
    Welcome to <b>Salon Aura</b><br>
    Premium beauty & care experience.<br>
    Elegance. Style. Confidence.
  </p>
</div>

<!-- ADMIN -->
<div id="admin">
  <div class="admin-card">
    <h2>Admin Dashboard</h2>
    <p>Demo version</p>
    <p>Bookings & reports coming soon</p>
    <br>
    <button class="btn c" onclick="showHome()">Logout</button>
  </div>
</div>

<script>
function toggleMenu(){
  side.classList.toggle("on");
  ov.classList.toggle("on");
}

function showHome(){
  home.style.display="block";
  about.style.display="none";
  admin.style.display="none";
  toggleMenu();
}

function showAbout(){
  home.style.display="none";
  about.style.display="block";
  admin.style.display="none";
  toggleMenu();
}

function adminLogin(){
  const pw = prompt("Enter admin password");
  if(pw === "_Aura2025"){
    home.style.display="none";
    about.style.display="none";
    admin.style.display="block";
    toggleMenu();
  }else{
    alert("Wrong password");
  }
}
</script>

</body>
</html>
