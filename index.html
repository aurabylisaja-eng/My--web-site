<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon Aura</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{
  background:radial-gradient(circle at top,#1a1f3c,#060814);
  color:#fff;
  height:100vh;
  overflow:hidden;
}

/* HEADER */
header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{letter-spacing:4px;font-size:26px}
header span{color:#cfae70;font-size:14px}

/* MENU */
.menu{
  position:fixed;
  inset:0;
  background:#060814;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:25px;
}
.menu a{
  color:#fff;
  text-decoration:none;
  font-size:22px;
}
.menu a:hover{color:#cfae70}
.menu.active{display:flex}

/* SECTIONS */
section{
  display:none;
  height:calc(100vh - 80px);
  padding:30px;
}
section.active{display:block}

/* HOME BUTTONS */
.home-links a{
  display:block;
  margin:18px auto;
  padding:18px;
  max-width:420px;
  text-align:center;
  border-radius:40px;
  text-decoration:none;
  color:#fff;
  font-size:18px;
}
.whatsapp{background:#25D366}
.instagram{background:#111}
.facebook{background:#1877f2}
.tiktok{background:#000}

/* CONTACT LINKS */
.contact a{
  display:block;
  padding:18px 0;
  font-size:20px;
  text-decoration:none;
  color:#fff;
}

/* BACK */
.back{
  margin-top:40px;
  color:#cfae70;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <div>
    <h1>SALON AURA</h1>
    <span>Where Beauty Meets Elegance</span>
  </div>
  <i class="fas fa-bars" onclick="toggleMenu()"></i>
</header>

<!-- MENU -->
<div class="menu" id="menu">
  <a onclick="openPage('home')">Home</a>
  <a onclick="openPage('contact')">Contact</a>
  <a onclick="openPage('admin')">Admin</a>
  <a onclick="toggleMenu()">Close</a>
</div>

<!-- HOME -->
<section id="home" class="active">
  <div class="home-links">
    <a class="whatsapp" href="https://wa.me/94774657460">WhatsApp</a>
    <a class="instagram" href="https://instagram.com/_salonaura_" target="_blank">Instagram</a>
    <a class="facebook" href="https://www.facebook.com/profile.php?id=61572539954499">Facebook</a>
    <a class="tiktok" href="https://www.tiktok.com/@_salonaura.official">TikTok</a>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="contact">
    <a href="https://wa.me/94774657460">WhatsApp</a>
    <a href="https://instagram.com/_salonaura_" target="_blank">Instagram</a>
    <a href="https://www.facebook.com/profile.php?id=61572539954499">Facebook</a>
    <a href="https://www.tiktok.com/@_salonaura.official">TikTok</a>
  </div>
  <div class="back" onclick="openPage('home')">← Back</div>
</section>

<!-- ADMIN -->
<section id="admin">
  <h2>Admin Dashboard</h2>
  <p style="margin-top:10px;opacity:.8">Welcome to Salon Aura Admin Panel</p>
  <div class="back" onclick="openPage('home')">← Back</div>
</section>

<script>
function toggleMenu(){
  document.getElementById('menu').classList.toggle('active')
}
function openPage(id){
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'))
  document.getElementById(id).classList.add('active')
  document.getElementById('menu').classList.remove('active')
}
</script>

</body>
</html>
