<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salon Aura | Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1a1f3c, #000);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    .card {
      background: #000;
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 40px rgba(218, 165, 32, 0.4);
      max-width: 320px;
      width: 100%;
    }

    h1 {
      color: #d4af37;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #d4af37, #f5d76e);
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Admin Dashboard</h1>
    <p>Welcome to Salon Aura Admin Panel.<br>You are successfully logged in.</p>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    function logout() {
      alert("Logged out successfully");
    }
  </script>
</body>
</html>
