<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon Aura | Admin Dashboard</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  font-family: "Segoe UI", sans-serif;
}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#000,#111);
  color:#d4af37;
  display:flex;
  justify-content:center;
  align-items:center;
}
.card{
  width:100%;
  max-width:380px;
  background:#000;
  padding:30px;
  border-radius:18px;
  box-shadow:0 0 35px rgba(212,175,55,0.25);
}
h2{
  text-align:center;
  margin-bottom:25px;
  letter-spacing:1px;
}
input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border:none;
  border-radius:10px;
  outline:none;
  font-size:15px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:#d4af37;
  color:#000;
  font-weight:700;
  font-size:15px;
}
button:active{
  transform:scale(0.97);
}
#dashboard{
  display:none;
}
.info{
  text-align:center;
  font-size:14px;
  opacity:.9;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Admin Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div class="card" id="dashboard">
  <h2>Admin Dashboard</h2>
  <p class="info">
    Welcome to <strong>Salon Aura</strong> Admin Panel.<br>
    You are successfully logged in.
  </p>
  <button onclick="logout()">Logout</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCTELgygHt9-9G-YgaH9wtKOc6f_rVKa9w",
  authDomain: "salon-aura-590b4.firebaseapp.com",
  projectId: "salon-aura-590b4",
  storageBucket: "salon-aura-590b4.firebasestorage.app",
  messagingSenderId: "133542313909",
  appId: "1:133542313909:web:9246b63754bfa0a90863fc"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  auth.signInWithEmailAndPassword(
    email.value,
    password.value
  )
  .then(()=>{
    loginBox.style.display="none";
    dashboard.style.display="block";
  })
  .catch(err=>alert(err.message));
}

function logout(){
  auth.signOut().then(()=>{
    location.reload();
  });
}
</script>

</body>
</html>
