<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon Aura</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{
  min-height:100vh;
  background:radial-gradient(circle at top,#1a1f3c,#050814);
  color:#fff;
}

/* MENU */
.menu{
  position:fixed;
  top:15px;
  right:15px;
  font-size:26px;
  cursor:pointer;
  z-index:10;
}
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  visibility:hidden;
}
.overlay.on{visibility:visible}
.side{
  position:fixed;
  top:0;
  right:-260px;
  width:260px;
  height:100%;
  background:#0b0f2a;
  padding:60px 25px;
  transition:.3s;
  z-index:11;
}
.side.on{right:0}
.side a{
  display:block;
  color:#fff;
  text-decoration:none;
  margin:18px 0;
  font-size:18px;
}
.side a:hover{color:#f4d37f}

/* SECTIONS */
.box{
  max-width:400px;
  margin:120px auto;
  text-align:center;
}
.contact, .admin{display:none}

/* CONTACT FORM */
.contact-form{
  margin-top:25px;
}
.contact-form input,
.contact-form textarea{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
  border:none;
}
.contact-form button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:25px;
  background:#f4d37f;
  font-size:16px;
  cursor:pointer;
}

/* ADMIN */
.admin input{
  width:100%;
  padding:12px;
  margin:12px 0;
  border-radius:8px;
  border:none;
}
</style>
</head>

<body>

<div class="menu" onclick="toggleMenu()">
  <i class="fa fa-bars"></i>
</div>

<div class="overlay" id="ov" onclick="toggleMenu()"></div>

<div class="side" id="side">
  <a href="#" onclick="showHome()">Home</a>
  <a href="#" onclick="showContact()">Contact</a>
  <a href="#" onclick="showAdmin()">Admin Login</a>
</div>

<!-- HOME -->
<div id="home" class="box">
  <h1>SALON AURA</h1>
  <p style="margin-top:12px;color:#f4d37f">
    Where Beauty Meets Elegance
  </p>
</div>

<!-- CONTACT -->
<div id="contact" class="box contact">
  <h2>Contact Us</h2>
  <p style="color:#ccc">We will contact you soon</p>

  <form class="contact-form">
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <input type="tel" placeholder="Phone Number" required>
    <textarea rows="4" placeholder="Message"></textarea>
    <button type="submit">Send Message</button>
  </form>
</div>

<!-- ADMIN -->
<div id="admin" class="box admin">
  <h2>Admin Login</h2>
  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">
  <button style="padding:10px 20px;border-radius:20px;border:none">Login</button>
</div>

<script>
function toggleMenu(){
  side.classList.toggle("on");
  ov.classList.toggle("on");
}
function showHome(){
  home.style.display="block";
  contact.style.display="none";
  admin.style.display="none";
  toggleMenu();
}
function showContact(){
  home.style.display="none";
  contact.style.display="block";
  admin.style.display="none";
  toggleMenu();
}
function showAdmin(){
  home.style.display="none";
  contact.style.display="none";
  admin.style.display="block";
  toggleMenu();
}
</script>

</body>
</html>
