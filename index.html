<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salon Aura</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{
  height:100vh;
  background: radial-gradient(circle at top, #1a1f3c, #05060f);
  color:#fff;
  overflow:hidden;
}

/* HEADER */
header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:28px;
  letter-spacing:4px;
  font-weight:700;
}

.tagline{
  font-size:14px;
  color:#c9a34e;
  margin-top:4px;
}

.menu-btn{
  font-size:26px;
  cursor:pointer;
}

/* SECTIONS */
section{
  display:none;
  height:100vh;
  padding:30px 20px;
}

section.active{
  display:block;
}

/* HOME BUTTONS */
.main-buttons{
  margin-top:40px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.main-btn{
  padding:18px;
  border-radius:40px;
  text-align:center;
  font-size:18px;
  font-weight:600;
  text-decoration:none;
  color:#fff;
}

.whatsapp{background:#25D366;}
.instagram{background:#1f1f1f;}
.facebook{background:#1877f2;}
.tiktok{background:#000;}

/* MENU OVERLAY */
.menu{
  position:fixed;
  top:0;
  right:-100%;
  width:100%;
  height:100%;
  background:#0b0e1a;
  padding:40px;
  transition:0.4s;
}

.menu.active{
  right:0;
}

.menu a{
  display:block;
  color:#fff;
  text-decoration:none;
  font-size:22px;
  margin:25px 0;
}

.close{
  font-size:26px;
  text-align:right;
  cursor:pointer;
}

/* BACK */
.back{
  margin-top:40px;
  color:#c9a34e;
  cursor:pointer;
  font-size:16px;
}
</style>
</head>

<body>

<header>
  <div>
    <div class="logo">SALON AURA</div>
    <div class="tagline">Where Beauty Meets Elegance</div>
  </div>
  <div class="menu-btn" onclick="openMenu()"><i class="fas fa-bars"></i></div>
</header>

<!-- HOME -->
<section id="home" class="active">
  <div class="main-buttons">
    <a class="main-btn whatsapp" href="https://wa.me/94774657460">WhatsApp</a>
    <a class="main-btn instagram" href="https://www.instagram.com/_.salonaura._">Instagram</a>
    <a class="main-btn facebook" href="https://www.facebook.com/profile.php?id=61572539954499">Facebook</a>
    <a class="main-btn tiktok" href="https://www.tiktok.com/@_salonaura.official">TikTok</a>
  </div>
</section>

<!-- ABOUT -->
<section id="about">
  <h2>About Salon Aura</h2>
  <p style="margin-top:20px; line-height:1.6;">
    Salon Aura is a modern professional salon delivering premium beauty experiences with elegance and care.
  </p>
  <div class="back" onclick="goHome()">← Back</div>
</section>

<!-- CONTACT -->
<section id="contact">
  <h2>Contact Us</h2>
  <div class="main-buttons">
    <a class="main-btn whatsapp" href="https://wa.me/94774657460">WhatsApp</a>
    <a class="main-btn instagram" href="https://www.instagram.com/_.salonaura._">Instagram</a>
    <a class="main-btn facebook" href="https://www.facebook.com/profile.php?id=61572539954499">Facebook</a>
    <a class="main-btn tiktok" href="https://www.tiktok.com/@_salonaura.official">TikTok</a>
  </div>
  <div class="back" onclick="goHome()">← Back</div>
</section>

<!-- MENU -->
<div class="menu" id="menu">
  <div class="close" onclick="closeMenu()">✕</div>
  <a onclick="openPage('home')">Home</a>
  <a onclick="openPage('about')">About</a>
  <a onclick="openPage('contact')">Contact</a>
</div>

<script>
function openMenu(){
  document.getElementById("menu").classList.add("active");
}
function closeMenu(){
  document.getElementById("menu").classList.remove("active");
}
function openPage(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  closeMenu();
}
function goHome(){
  openPage('home');
}
</script>

</body>
</html>
